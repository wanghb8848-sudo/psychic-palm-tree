name: fetch
on:
  push:
    branches: [logi-assets]
    paths: ['urls.txt']
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: logi-assets }
      - name: download
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          export UA
          grep -v '^\s*$' urls.txt | while read -r name url; do [ -s "out/$name" ] || echo "$name $url"; done > todo.txt
          wc -l todo.txt
          cat todo.txt | xargs -P 12 -L 1 bash -c 'mkdir -p "out/$(dirname "$0")"; code=$(curl -sL -A "$UA" -H "Accept-Language: zh-CN,zh;q=0.9" --compressed -m 60 -o "out/$0" -w "%{http_code}" "$1" || echo ERR); echo "$code $0" >> out/_log_$GITHUB_RUN_ID.txt; [ "$code" = "200" ] || rm -f "out/$0"'
      - name: commit to result branch
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout -b res-$GITHUB_RUN_ID
          git add out
          git commit -qm "fetched $GITHUB_RUN_ID" || exit 0
          git push -q origin res-$GITHUB_RUN_ID
