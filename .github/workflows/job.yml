name: job
on:
  push:
    branches: [logi-assets]
    paths: ['job.sh']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: logi-assets }
      - name: run
        run: bash job.sh > job_out.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "job result" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin logi-assets && git push origin HEAD:logi-assets && break; sleep 5; done
